name: ci

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Verify formatting
        run: |
          files="$(find cmd internal -type f -name '*.go')"
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Unit tests
        run: go test -race -cover ./...
      - name: Vet
        run: go vet ./...
      - name: Build all packages
        run: CGO_ENABLED=0 go build ./...
      - name: Validate Compose
        run: cp .env.example .env && docker compose config --quiet

  integration:
    name: PostgreSQL and Redis integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://marketplace:marketplace@localhost:5432/marketplace_test?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
        run: go test -tags=integration -race -v ./internal/integration/...
