name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Build Linux binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/marketplace-api-linux-amd64 ./cmd/api
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/marketplace-api-linux-arm64 ./cmd/api
          tar -czf dist/marketplace-api-linux-amd64.tar.gz -C dist marketplace-api-linux-amd64
          tar -czf dist/marketplace-api-linux-arm64.tar.gz -C dist marketplace-api-linux-arm64
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/marketplace-api-linux-amd64.tar.gz
            dist/marketplace-api-linux-arm64.tar.gz
            dist/SHA256SUMS
